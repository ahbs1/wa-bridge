version: '3.8'

services:
  wa-bridge:
    build: .
    container_name: wa-bridge
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - wa_data:/app/data
    env_file:
      - .env
    environment:
      - GIN_MODE=release
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  wa_data:
    driver: local
